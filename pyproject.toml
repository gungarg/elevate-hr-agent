[project]
name = "elevate-hr-agent"
version = "0.1.0"
description = "Enterprise HR & IT Multi-Agent Assistant powered by Google ADK 2.0 and Open Knowledge Format (OKF)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=0.2.0",
    "google-genai>=1.0.0",
    "google-cloud-storage>=2.14.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "fastmcp>=0.4.1",
    "python-dotenv>=1.0.1",
]

[project.scripts]
hr-agent = "agent.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
