[project]
name = "elevate-hr-agent"
version = "0.1.0"
description = "Enterprise HR Multi-Agent Application with ADK 2.0 and Open Knowledge Format (OKF)"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "google-adk>=0.2.0",
    "google-genai>=1.0.0",
    "google-cloud-storage>=2.14.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "fastmcp>=0.4.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "knowledge"]
